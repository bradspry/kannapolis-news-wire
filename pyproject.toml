[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kspider"
version = "0.1.0"
description = "A configurable web spider/scraper"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "click>=8.1",
    "ddgs>=1.0",
    "feedparser>=6.0",
    "googlesearch-python>=1.2",
    "youtube-search-python>=1.6",
    "python-dotenv>=1.0",
]

[project.scripts]
kspider = "kspider.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.package-data]
kspider = ["templates/*.html", "templates/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
